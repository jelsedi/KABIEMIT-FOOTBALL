<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teams — Village Football</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand">Village Football</div>
    <nav>
      <a href="/">Home</a>
      <a href="/fixtures.html">Fixtures</a>
      <a href="/transfers.html">Transfers</a>
      <a href="/admin/login.html">Admin</a>
    </nav>
  </div>

  <main>
    <h1>Teams</h1>
    <div id="teams-list"></div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    async function loadTeams() {
      const teams = await API.get('/teams');
      const listEl = document.getElementById('teams-list');

      if (!teams.length) {
        listEl.innerHTML = '<div class="empty-state">No teams registered yet.</div>';
        return;
      }

      listEl.innerHTML = teams.map(t => `
        <div class="card">
          <div class="teams">${t.name}</div>
          <div class="meta">${t.home_ground || 'Home ground not set'}${t.founded_year ? ' · est. ' + t.founded_year : ''}</div>
        </div>
      `).join('');
    }

    loadTeams().catch(err => {
      document.getElementById('teams-list').innerHTML =
        `<div class="error-text">${err.message}</div>`;
    });
  </script>
</body>
</html>
