<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discipline — Village Football</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand">Village Football</div>
    <nav>
      <a href="/">Home</a>
      <a href="/fixtures.html">Fixtures</a>
      <a href="/teams.html">Teams</a>
      <a href="/standings.html">Standings</a>
      <a href="/roster.html">Roster</a>
      <a href="/discipline.html">Discipline</a>
      <a href="/referee/login.html">Referee</a>
      <a href="/admin/login.html">Admin</a>
    </nav>
  </div>

  <main>
    <h1>Suspended Players</h1>
    <p style="color:var(--text-muted)">
      Check here before naming a matchday squad — a suspended player
      cannot legally play until their ban is served.
    </p>
    <div id="suspensions-list"></div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    async function loadSuspensions() {
      const cards = await API.get('/discipline?active=true');
      const listEl = document.getElementById('suspensions-list');

      if (!cards.length) {
        listEl.innerHTML = '<div class="empty-state">No active suspensions right now.</div>';
        return;
      }

      listEl.innerHTML = cards.map(c => `
        <div class="card">
          <div class="fixture-row">
            <div>
              <div class="teams">${c.player.name}${c.player.team ? ' — ' + c.player.team.name : ''}</div>
              <div class="meta">${c.card_type === 'red' ? 'Red card' : 'Yellow card'}${c.reason ? ': ' + c.reason : ''}</div>
            </div>
            <div class="status-tag live">
              ${c.matches_served}/${c.suspension_matches} matches served
            </div>
          </div>
        </div>
      `).join('');
    }

    loadSuspensions().catch(err => {
      document.getElementById('suspensions-list').innerHTML =
        `<div class="error-text">${err.message}</div>`;
    });
  </script>
</body>
</html>
